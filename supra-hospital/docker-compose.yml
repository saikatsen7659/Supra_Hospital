services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: supra_hospital
      MYSQL_USER: supra_user
      MYSQL_PASSWORD: change-this-password
      MYSQL_ROOT_PASSWORD: change-root-password
    ports:
      - "3307:3306"
    volumes:
      - supra_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-root-password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  supra_mysql_data:
